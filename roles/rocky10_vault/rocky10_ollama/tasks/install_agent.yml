---
- name: Create agent user
  ansible.builtin.user:
    name: agent
    comment: "Agent user"
    shell: /bin/bash
    create_home: yes
    state: present

- name: Ensure .ssh directory exists
  ansible.builtin.file:
    path: /home/agent/.ssh
    state: directory
    owner: agent
    group: agent
    mode: '0700'

- name: Generate SSH key for agent
  community.crypto.openssh_keypair:
    path: /home/agent/.ssh/id_ed25519
    type: ed25519
    owner: agent
    group: agent
    mode: '0600'
    force: no
  register: agent_ssh_key

- name: Set authorized_keys
  ansible.posix.authorized_key:
    user: agent
    state: present
    key: "{{ agent_ssh_key.public_key }}"