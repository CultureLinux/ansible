# Scrape config example
#
scrape_configs:
  - job_name: self_scrape
    scrape_interval: 10s
    static_configs:
      - targets: ['127.0.0.1:8428'] 

  - job_name: node_exporter_local
    scrape_interval: 10s
    static_configs:
      - targets: 
        - 'prox-gate.local.clinux.fr:9100'
        - 'prox-docky.local.clinux.fr:9100'
        - 'prox-eye.local.clinux.fr:9100'
        - 'prox-hosting.local.clinux.fr:9100'
        - 'raspap.local.clinux.fr:9100'
        - 'web.lab.clinux.fr:9100'
        - 'doc.clinux.fr:9100'
        - 'prox2-docky.local.clinux.fr:9100'


  - job_name: proxmox_exporter_local_1
    scrape_interval: 10s
    static_configs:
      - targets: 
        - 'proxmox.local.clinux.fr:9221'
        - 'proxmox2.local.clinux.fr:9221'
    metrics_path: /pve
    params:
      target: 
        - 'proxmox.local.clinux.fr'
      module: [default]
      cluster: ['1']
      node: ['1']


  - job_name: proxmox_exporter_local_2
    scrape_interval: 10s
    static_configs:
      - targets: 
        - 'proxmox2.local.clinux.fr:9221'
    metrics_path: /pve
    params:
      target: 
        - 'proxmox2.local.clinux.fr'
      module: [default]
      cluster: ['1']
      node: ['1']

